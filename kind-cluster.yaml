kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: monitoramento
nodes:
  - role: control-plane
    extraPortMappings:
      # broker MQTT acessível na LAN para a ESP32
      - containerPort: 31883
        hostPort: 1883
        protocol: TCP
      # dashboard via NodePort
      - containerPort: 30080
        hostPort: 8080
        protocol: TCP
  - role: worker
  - role: worker
