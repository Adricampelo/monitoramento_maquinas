kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: monitoramento
nodes:
  - role: control-plane
    extraPortMappings:
      # gateway acessível na LAN para a ESP32 (http://<ip-do-pc>:8000)
      - containerPort: 30000
        hostPort: 8000
        protocol: TCP
      # dashboard (http://localhost:8080)
      - containerPort: 30080
        hostPort: 8080
        protocol: TCP
  - role: worker
  - role: worker
