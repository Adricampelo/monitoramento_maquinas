apiVersion: v1
kind: ConfigMap
metadata:
  name: mosquitto-config
  namespace: monitoramento
data:
  mosquitto.conf: |
    listener 1883
    allow_anonymous false
    password_file /mosquitto/creds/pwfile

    persistence true
    persistence_location /mosquitto/data/
    persistent_client_expiration 10m

    max_queued_messages 10000
    max_inflight_messages 20

    log_dest stdout
    log_type error
    log_type warning
    log_type notice
    connection_messages true
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mosquitto-dados
  namespace: monitoramento
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mosquitto
  namespace: monitoramento
spec:
  replicas: 1
  strategy:
    type: Recreate          # PVC RWO: nunca dois pods no mesmo volume
  selector:
    matchLabels:
      app: mosquitto
  template:
    metadata:
      labels:
        app: mosquitto
    spec:
      containers:
        - name: mosquitto
          image: eclipse-mosquitto:2
          ports:
            - name: mqtt
              containerPort: 1883
          volumeMounts:
            - name: config
              mountPath: /mosquitto/config
            - name: creds
              # subPath: entrega o arquivo real. Sem isso o kubelet monta um
              # symlink e o mosquitto 2.x recusa abrir o password_file.
              mountPath: /mosquitto/creds/pwfile
              subPath: pwfile
              readOnly: true
            - name: dados
              mountPath: /mosquitto/data
          readinessProbe:
            tcpSocket:
              port: 1883
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: 1883
            initialDelaySeconds: 10
            periodSeconds: 15
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi
      volumes:
        - name: config
          configMap:
            name: mosquitto-config
        - name: creds
          secret:
            secretName: mqtt-creds
        - name: dados
          persistentVolumeClaim:
            claimName: mosquitto-dados
---
apiVersion: v1
kind: Service
metadata:
  name: mosquitto
  namespace: monitoramento
spec:
  selector:
    app: mosquitto
  ports:
    - name: mqtt
      port: 1883
      targetPort: 1883
      nodePort: 31883
  type: NodePort
