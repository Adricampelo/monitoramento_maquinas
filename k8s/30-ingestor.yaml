apiVersion: v1
kind: Service
metadata:
  name: ingestor
  namespace: monitoramento
spec:
  clusterIP: None          # headless: dá identidade estável a cada réplica
  selector:
    app: ingestor
  ports:
    - name: http
      port: 8080
      targetPort: 8080
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: ingestor
  namespace: monitoramento
  labels:
    app: ingestor
spec:
  serviceName: ingestor
  replicas: 2
  podManagementPolicy: Parallel
  selector:
    matchLabels:
      app: ingestor
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: ingestor
    spec:
      terminationGracePeriodSeconds: 30
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: ingestor
      containers:
        - name: ingestor
          image: monitoramento/ingestor:0.1
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: MQTT_HOST
              value: mosquitto
            - name: MQTT_PORT
              value: "1883"
            - name: MQTT_USER
              value: sensor
            - name: MQTT_PASS
              valueFrom:
                secretKeyRef:
                  name: mqtt-creds
                  key: senha
            - name: MQTT_SHARE_GROUP
              value: ingestores
            - name: POSTGRES_DSN
              valueFrom:
                secretKeyRef:
                  name: postgres-creds
                  key: dsn
            - name: FLUSH_INTERVAL_S
              value: "1.0"
            - name: BATCH_SIZE
              value: "50"
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 15
            periodSeconds: 15
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 512Mi
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
