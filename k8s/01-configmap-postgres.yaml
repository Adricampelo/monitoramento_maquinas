apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-init
  namespace: monitoramento
data:
  init.sql: |
    CREATE TABLE IF NOT EXISTS telemetria (
        maquina_id     text             NOT NULL,
        seq            bigint           NOT NULL,
        recebido_em    timestamptz      NOT NULL DEFAULT now(),
        ts_dispositivo timestamptz,
        temp           double precision,
        vibra          double precision,
        fw             text,
        PRIMARY KEY (maquina_id, seq)
    );

    CREATE INDEX IF NOT EXISTS telemetria_maquina_tempo_idx
        ON telemetria (maquina_id, recebido_em DESC);

    CREATE INDEX IF NOT EXISTS telemetria_tempo_idx
        ON telemetria (recebido_em DESC);
