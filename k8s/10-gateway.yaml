apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: monitoramento
  labels:
    app: gateway
spec:
  replicas: 2
  selector:
    matchLabels:
      app: gateway
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0   # atualização sem derrubar o serviço
      maxSurge: 1
  template:
    metadata:
      labels:
        app: gateway
    spec:
      topologySpreadConstraints:   # espalha as réplicas entre os nós
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: gateway
      containers:
        - name: gateway
          image: monitoramento/gateway:0.1
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: interscity
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi
---
# Balanceia as requisições entre as réplicas. NodePort 30000 -> porta 8000 do host (kind).
apiVersion: v1
kind: Service
metadata:
  name: gateway
  namespace: monitoramento
spec:
  type: NodePort
  selector:
    app: gateway
  ports:
    - name: http
      port: 8000
      targetPort: http
      nodePort: 30000
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: gateway
  namespace: monitoramento
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: gateway
  minReplicas: 2
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
